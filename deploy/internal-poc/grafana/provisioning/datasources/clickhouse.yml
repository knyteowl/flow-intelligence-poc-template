apiVersion: 1

datasources:
  - name: ClickHouse Flow POC
    type: grafana-clickhouse-datasource
    access: proxy
    uid: clickhouse-flow-poc
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: flow_poc
      username: grafana
      tlsSkipVerify: false
    secureJsonData:
      password: ${CLICKHOUSE_GRAFANA_PASSWORD}
